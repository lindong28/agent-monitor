name: CI
on:
  push:
    branches: [ci/autoloop-acceptance-20261104]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: python3 tests/fixtures/autoloop/check.py
