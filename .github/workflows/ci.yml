    branches: [ci/event-platform-acceptance-20261104]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: python3 tests/fixtures/event_platform/check.py
