<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>agent-monitor 网络</title>
    <link rel="stylesheet" href="/web/styles.css">
    <script src="/web/vendor/chart.umd.min.js"></script>
    <script src="/web/app.js"></script>
    <script src="/web/pivot.js"></script>
  </head>
  <body>
    <header class="app-header">
      <a class="brand" data-preserve-range href="/">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-title">agent-monitor</span>
      </a>
      <nav class="top-nav" aria-label="区域导航">
        <a data-area="console" aria-current="page" href="/">控制台</a>
        <a data-area="guide" data-preserve-range href="/guide">使用与接入</a>
      </nav>
      <button class="header-search" id="open-page-search" type="button" aria-haspopup="dialog" aria-controls="page-search"><span aria-hidden="true">⌕</span> 搜索页面与帮助</button>
    </header>
    <dialog id="page-search" class="page-search" aria-labelledby="page-search-title">
      <div class="search-heading"><h2 id="page-search-title">搜索页面与帮助</h2><button type="button" id="close-page-search" aria-label="关闭搜索">关闭</button></div>
      <p class="scope-note">查找功能入口和接入说明；账号与会话内容请使用各页面的筛选。</p>
      <label class="sr-only" for="page-search-input">页面或帮助关键词</label>
      <div class="search-input-row"><input id="page-search-input" type="search" placeholder="搜索总览、会话、安装…" autocomplete="off"><button type="button" id="clear-page-search">清空</button></div>
      <p id="page-search-count" class="scope-note" role="status"></p>
      <div id="page-search-results" class="search-results"></div>
    </dialog>
    <div class="app-shell">
      <aside class="sidebar">
        <nav class="nav" aria-label="控制台导航">
          <a data-nav href="/">总览</a>
          <a data-nav href="/explore">透视</a>
          <a data-nav href="/sessions">会话</a>
          <a data-nav href="/collection">采集与诊断</a>
          <a data-nav href="/network">网络</a>
        </nav>
        <nav class="guide-nav" aria-label="使用指南章节" hidden>
          <span class="nav-caption">使用指南</span>
          <a href="/guide#sources">数据来源</a>
          <a href="/guide#collection">采集状态</a>
          <a href="/guide#setup">首次接入</a>
          <a href="/guide#questions">查找证据</a>
        </nav>
      </aside>
      <main class="main network-main">
        <div class="page-toolbar">
          <h1 class="page-title">网络</h1>
          <div class="toolbar">
            <button id="refresh" class="icon-btn" type="button" title="重新检测" aria-busy="false">重新检测</button>
          </div>
        </div>
        <p id="network-checked-host" class="scope-note">检测目标：服务端主机（身份加载中）；不检测浏览器所在设备，不跨机合并。</p>
        <section id="network-banner" class="verdict-banner unknown" aria-live="polite">
          <span id="network-verdict">—</span>
          <span id="network-updated" class="network-updated">—</span>
        </section>
        <section id="network-error" class="network-error" role="alert" aria-live="assertive" hidden></section>
        <section class="network-grid" aria-label="网络诊断">
          <article class="network-card network-card-conclusion">
            <h2>结论</h2>
            <div id="network-conclusion" class="network-card-body"></div>
          </article>
          <article class="network-card">
            <h2>时区</h2>
            <div id="network-timezone" class="network-card-body"></div>
          </article>
          <article class="network-card">
            <h2>服务端本机</h2>
            <div id="network-local" class="network-card-body"></div>
          </article>
          <article class="network-card">
            <h2>公网出口</h2>
            <div id="network-public" class="network-card-body"></div>
          </article>
          <article class="network-card">
            <h2>风险与代理信息</h2>
            <div id="network-risk" class="network-card-body"></div>
          </article>
        </section>
      </main>
    </div>
    <script>
      AgentMonitor.initClientNavigation();
      AgentMonitor.initNetwork().catch((error) => {
        console.error(error);
        document.querySelector("main").insertAdjacentHTML("beforeend",
          '<p class="error">页面未能完整加载，请重新加载页面。</p>');
      });
    </script>
  </body>
</html>
