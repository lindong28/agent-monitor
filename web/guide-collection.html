<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>agent-monitor 采集状态</title>
    <link rel="stylesheet" href="/web/styles.css">
    <script src="/web/vendor/chart.umd.min.js"></script>
    <script src="/web/app.js"></script>
    <script src="/web/pivot.js"></script>
  </head>
  <body>
    <dialog id="page-search" class="page-search" aria-labelledby="page-search-title">
      <div class="search-heading"><h2 id="page-search-title">搜索页面与帮助</h2><button type="button" id="close-page-search" aria-label="关闭搜索">关闭</button></div>
      <p class="scope-note">查找功能入口和接入说明；账号与会话内容请使用各页面的筛选。</p>
      <label class="sr-only" for="page-search-input">页面或帮助关键词</label>
      <div class="search-input-row"><input id="page-search-input" type="search" placeholder="搜索总览、会话、安装…" autocomplete="off"><button type="button" id="clear-page-search">清空</button></div>
      <p id="page-search-count" class="scope-note" role="status"></p>
      <div id="page-search-results" class="search-results"></div>
    </dialog>
    <div class="app-shell">
      <aside class="sidebar">
        <header class="app-header">
          <a class="brand" data-preserve-range href="/">
            <span class="brand-mark" aria-hidden="true"></span>
            <span class="brand-title">agent-monitor</span>
          </a>
          <nav class="top-nav" aria-label="区域导航">
            <a data-area="console" href="/">控制台</a>
            <a data-area="guide" aria-current="page" data-preserve-range href="/guide/sources">使用与接入</a>
          </nav>
          <button class="header-search" id="open-page-search" type="button" aria-haspopup="dialog" aria-controls="page-search"><span aria-hidden="true">⌕</span> 搜索页面与帮助</button>
        </header>
        <nav class="nav" aria-label="控制台导航" hidden>
          <a data-nav href="/">总览</a>
          <a data-nav href="/explore">透视</a>
          <a data-nav href="/sessions">会话</a>
          <a data-nav href="/collection">采集与诊断</a>
          <a data-nav href="/network">网络</a>
        </nav>
        <nav class="nav guide-nav" aria-label="使用与接入导航">
          <a href="/guide/sources">数据来源</a>
          <a href="/guide/collection" aria-current="page">采集状态</a>
          <a href="/guide/setup">首次接入</a>
          <a href="/guide/questions">查找证据</a>
        </nav>
      </aside>
      <main class="main guide-main">
        <div class="page-toolbar"><div class="page-location"><span class="workspace-label">使用与接入</span><span class="breadcrumb-separator" aria-hidden="true">/</span><h1 class="page-title">采集状态</h1></div><button id="refresh" type="button" class="btn">更新采集状态</button></div>
        <article class="guide-article">
        <section class="panel" id="collection">
          <div class="panel-head"><h2>当前采集状态</h2></div>
          <p class="scope-note">“机器快照可读”表示能够读取该机器已采集的数据，不表示每种来源都有数据，也不保证历史完整。无匹配记录不等于尚未接入。</p>
          <div class="panel-head"><span id="sync-coverage" class="status-line">机器快照可读：—/— 台</span><span id="sync-summary" class="status-line" aria-live="polite">检查中…</span></div>
          <div id="sync-machines"></div><a id="sync-overview-link" data-collection-link href="/collection">查看机器、质量与历史详情</a>
        </section>
        </article>
      </main>
    </div>
    <script>AgentMonitor.initClientNavigation(); AgentMonitor.initGuide();</script>
  </body>
</html>
